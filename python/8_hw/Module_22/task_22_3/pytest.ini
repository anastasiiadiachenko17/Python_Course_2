[pytest]
pythonpath = .
testpaths = tests
addopts =
    -v -rsx --strict-markers --reruns 3 --reruns-delay 1
    --html=artifacts/report.html --self-contained-html

markers =
    palindrome: tests that check if a string is a palindrome
    P0: highest priority tests

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S

log_file = artifacts/pytest.log.txt
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_file_date_format = %H:%M:%S
